[package]
name = "patchwork-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "patchwork-web"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
actix-files = { version = "0.6", optional = true }
actix-web = { version = "4", optional = true }
argon2 = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
gloo-net = { version = "0.6", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
futures-util = { version = "0.3", optional = true }
flate2 = { version = "1", optional = true }
jsonwebtoken = { version = "9.3", optional = true }
leptos = { version = "0.8.17", default-features = false }
mime_guess = { version = "2.0.5", optional = true }
patchwork-database = { path = "../patchwork-database", optional = true }
patchwork = { path = "../patchwork", optional = true }
patchwork-registry-types = { path = "../patchwork-registry-types" }
patchwork-ui = { path = "../patchwork-ui", default-features = false }
rand = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
resend-rs = { version = "0.29", default-features = false, features = ["rustls-tls"], optional = true }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"], optional = true }
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
url = { version = "2.5", optional = true }
uuid = { version = "1.24", features = ["serde"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["HtmlInputElement", "Location", "Storage", "SubmitEvent", "Window"] }

[features]
default = ["server"]
csr = [
    "dep:console_error_panic_hook",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:serde_json",
    "dep:sha2",
    "dep:wasm-bindgen",
    "dep:url",
    "leptos/csr",
    "patchwork-ui/csr",
]
server = [
    "dep:actix-files",
    "dep:actix-web",
    "dep:argon2",
    "dep:base64",
    "dep:chrono",
    "dep:clap",
    "dep:futures-util",
    "dep:flate2",
    "dep:jsonwebtoken",
    "dep:mime_guess",
    "dep:patchwork-database",
    "dep:patchwork",
    "dep:rand",
    "dep:reqwest",
    "dep:resend-rs",
    "dep:rust-embed",
    "dep:semver",
    "dep:serde_json",
    "dep:sha2",
    "dep:toml",
    "dep:tar",
    "dep:url",
    "dep:uuid",
]

[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

[dev-dependencies]
tempfile = "3.20"

[package.metadata.leptos]
output-name = "patchwork_web"
site-root = "dist"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "public/styles.css"
site-addr = "127.0.0.1:8080"
reload-port = 3001
browserquery = "defaults"
lib-features = ["csr"]
lib-default-features = false
bin-features = ["server"]
bin-default-features = false
bin-cargo-command = "bash scripts/cargo-leptos-server.sh"
lib-profile-release = "wasm-release"
