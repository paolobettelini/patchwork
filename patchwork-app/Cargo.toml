[package]
name = "patchwork-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "patchwork-app"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.17", default-features = false }
patchwork-ui = { path = "../patchwork-ui", default-features = false }
patchwork-registry-types = { path = "../patchwork-registry-types" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlDivElement", "Window"] }

[features]
default = ["csr"]
csr = ["leptos/csr", "patchwork-ui/csr"]

[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

[package.metadata.leptos]
output-name = "patchwork_app"
site-root = "dist"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "public/styles.css"
site-addr = "127.0.0.1:1420"
reload-port = 1421
browserquery = "defaults"
lib-features = ["csr"]
lib-default-features = false
bin-features = []
bin-default-features = false
lib-profile-release = "wasm-release"
