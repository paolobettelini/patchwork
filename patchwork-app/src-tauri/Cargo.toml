[package]
name = "patchwork-app-tauri"
version = "0.1.0"
edition = "2024"

[lib]
name = "patchwork_app_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
patchwork = { path = "../../patchwork" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
toml = "0.9"
