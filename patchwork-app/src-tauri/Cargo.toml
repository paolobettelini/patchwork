[package]
name = "patchwork-app-tauri"
version = "0.1.0"
edition = "2024"

[lib]
name = "patchwork_app_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
flate2 = "1"
patchwork = { path = "../../patchwork" }
patchwork-registry-types = { path = "../../patchwork-registry-types" }
portable-pty = "0.9"
libc = "0.2"
os_pipe = "1.2"
rand = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tar = "0.4"
toml = "0.9"
semver = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
webbrowser = "1"

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
